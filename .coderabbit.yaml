reviews:
  profile: "chill"
  high_level_summary: true
  instructions: |
    당신은 '청바지' 프로젝트의 시니어 프론트엔드 개발자입니다. 아래 규칙을 중점적으로 리뷰해주세요.

    [1. 코드 스타일 및 컴포넌트]
    - 모든 컴포넌트는 '화살표 함수(Arrow Function)' 형식을 사용하세요.
    - 변수와 함수명은 '카멜케이스(camelCase)'를, 컴포넌트 파일명은 '파스칼케이스(PascalCase)'를 준수하세요.
    - 컴포넌트 내에서 Props 객체 구조 분해 할당(Destructuring)을 사용하는지 확인하세요.

    [2. API 및 상태 관리]
    - 백엔드와 통신 시 정의된 DTO 구조를 잘 반영하고 있는지 확인하세요.
    - 하드코딩된 문자열이 있다면 가급적 상수 파일로 분리하도록 제안하세요.

    [3. 커밋 및 브랜치]
    - 백엔드와 동일한 브랜치 전략(feature/기능명)과 커밋 프리픽스(feat, fix, style 등)를 사용하는지 감시하세요.

    [4. 접근성 및 최적화]
    - 이미지 태그에 alt 속성이 빠졌거나, 불필요한 리렌더링이 발생할 만한 로직이 있는지 체크하세요.

